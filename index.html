<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurutattva - Registration</title>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-brown: #6b5a3e;
      --brand-blue: #8ecae6;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: url('background.jpg') center center no-repeat fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .serif-title { font-family: 'Cinzel', serif; }

    /* Unified Box - 30% Transparency as per photo */
    .main-unified-box {
      background: rgba(255, 255, 255, 0.3); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.3);
    }

    /* Inner Cards - Solid White */
    .inner-card {
      background: rgba(255, 255, 255, 0.85); 
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .input-wrapper {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .input-wrapper:focus-within {
      border-color: var(--brand-brown);
      box-shadow: 0 0 0 4px rgba(107, 90, 62, 0.1);
    }

    .field-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      margin-bottom: 6px;
    }

    .btn-submit {
      background: var(--brand-brown);
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      background: #4a3f2d;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen py-10 px-4 flex justify-center items-start">

  <!-- THE SINGLE UNIFIED BOX -->
  <div class="main-unified-box w-full max-w-3xl rounded-[3.5rem] overflow-hidden flex flex-col">
    
    <!-- Header Section (Matches Uploaded Photo) -->
    <header class="p-10 sm:p-14 flex flex-col items-center justify-center border-b border-white/20 text-center">
      <div class="flex items-center justify-center gap-4 mb-4">
        <img src="logo.png" alt="Logo" class="h-20 sm:h-24 w-auto drop-shadow-md">
        <h1 class="serif-title text-2xl sm:text-4xl font-bold tracking-tight text-[#2d271e] uppercase">Dhyansthali Navsari</h1>
      </div>
      <p class="text-xs sm:text-base font-bold text-stone-800 tracking-wide italic">
        A Meditation Sanctuary | Arabian Sea 🌊
      </p>
    </header>

    <!-- Form Section -->
    <main class="p-6 sm:p-12 flex-1">
      <form id="registrationForm" class="space-y-10">
        
        <!-- Date Card -->
        <div class="inner-card p-8">
          <div class="field-label">Planned Visit Date</div>
          <div class="input-wrapper px-4 py-3.5">
            <input type="date" id="visitDate" required class="w-full bg-transparent outline-none text-stone-900 font-bold">
          </div>
        </div>

        <!-- Visitor 1 -->
        <div class="inner-card p-8 border-l-8 border-[#6b5a3e]">
          <div class="flex items-center gap-4 mb-8">
            <div class="h-9 w-9 rounded-full bg-[#6b5a3e] text-white flex items-center justify-center font-bold text-sm">1</div>
            <h3 class="serif-title text-xl font-bold text-stone-900">Primary Visitor</h3>
          </div>

          <div class="grid grid-cols-1 gap-6">
            <div>
              <div class="field-label">Mobile Number</div>
              <div class="flex gap-3">
                <div class="flex items-center gap-2 px-4 py-3.5 input-wrapper bg-stone-50">
                  <img src="https://flagcdn.com/w40/in.png" class="w-6 shadow-sm">
                  <span class="font-bold text-stone-700 text-sm">+91</span>
                </div>
                <div class="input-wrapper flex-1 px-5 py-3.5">
                  <input type="tel" id="phone" placeholder="Mobile Number" required class="w-full bg-transparent outline-none">
                </div>
              </div>
            </div>

            <div>
              <div class="field-label">Full Name</div>
              <div class="input-wrapper px-5 py-3.5">
                <input type="text" id="fullName" placeholder="Full name as per ID" required class="w-full bg-transparent outline-none">
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <div class="field-label">Email</div>
                <div class="input-wrapper px-5 py-3.5">
                  <input type="email" id="email" placeholder="Email Address" required class="w-full bg-transparent outline-none">
                </div>
              </div>
              <div>
                <div class="field-label">Age</div>
                <div class="input-wrapper px-5 py-3.5">
                  <input type="number" id="age" placeholder="Age" required class="w-full bg-transparent outline-none">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Additional Members Container -->
        <div id="membersContainer" class="space-y-8"></div>

        <!-- Add Button -->
        <button type="button" id="addMemberBtn" class="w-full py-5 rounded-2xl border-2 border-dashed border-white/60 text-stone-900 font-black text-xs uppercase tracking-[0.2em] flex items-center justify-center gap-3 hover:bg-white/20 transition-all">
          <i class="fa-solid fa-plus-circle text-lg"></i> Add Family Member
        </button>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit w-full py-6 text-white font-black text-xl rounded-[2rem] flex items-center justify-center gap-4 mt-12 shadow-2xl tracking-[0.3em]">
          <span>SUBMIT</span>
          <i class="fa-solid fa-paper-plane text-base opacity-80"></i>
        </button>
      </form>
    </main>

    <!-- Footer Section -->
    <footer class="bg-black/40 p-10 sm:p-14 text-white border-t border-white/10">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-12">
        <div>
          <h4 class="serif-title text-sm font-black text-[#8ecae6] tracking-[0.25em] mb-4 uppercase">Location</h4>
          <p class="text-sm leading-relaxed text-white font-medium">
            Samarpan Ashram Marg, Dandi-Onjal Road,<br>
            Dandi, Gujarat 396412.
          </p>
        </div>
        <div>
          <h4 class="serif-title text-sm font-black text-[#8ecae6] tracking-[0.25em] mb-4 uppercase">Connect</h4>
          <div class="text-sm space-y-4 text-white font-bold">
            <p><i class="fa-solid fa-phone-volume mr-2 text-[#8ecae6]"></i> 9824330246</p>
            <p><i class="fa-solid fa-envelope-open-text mr-2 text-[#8ecae6]"></i> dhyansthalinavsari@gmail.com</p>
          </div>
        </div>
      </div>
      <div class="mt-10 pt-6 border-t border-white/10 text-center">
        <p class="text-[10px] text-stone-400 font-bold uppercase tracking-[0.3em]">Gurutattva • Spiritual Sanctuary</p>
      </div>
    </footer>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx11gkiVOS8G0imymHIQ3b-0VavqPRLQfwcurAyBnF2yAfDgUlnLHZKM7xyMUQh3Mpe/exec";

    document.addEventListener('DOMContentLoaded', () => {
      const addBtn = document.getElementById('addMemberBtn');
      const container = document.getElementById('membersContainer');
      let memberCount = 1;

      const dateInp = document.getElementById('visitDate');
      const tmrw = new Date();
      tmrw.setDate(tmrw.getDate() + 1);
      dateInp.min = tmrw.toISOString().split('T')[0];

      addBtn.onclick = () => {
        memberCount++;
        const div = document.createElement('div');
        div.className = "inner-card p-8 relative animate-in fade-in slide-in-from-top-4 duration-300";
        div.innerHTML = `
          <button type="button" onclick="this.parentElement.remove()" class="absolute top-6 right-6 text-stone-400 hover:text-rose-600 transition-all">
            <i class="fa-solid fa-circle-xmark text-2xl"></i>
          </button>
          <div class="flex items-center gap-4 mb-8">
            <div class="h-9 w-9 rounded-full bg-stone-100 text-stone-500 flex items-center justify-center font-bold text-sm shadow-inner">${memberCount}</div>
            <h3 class="serif-title font-bold text-stone-900 text-xl">Visitor ${memberCount}</h3>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
             <div class="sm:col-span-2">
                <div class="field-label">Full Name</div>
                <div class="input-wrapper px-5 py-3.5"><input type="text" placeholder="Visitor Name" required class="w-full bg-transparent outline-none"></div>
             </div>
             <div>
                <div class="field-label">Mobile</div>
                <div class="input-wrapper px-5 py-3.5"><input type="tel" placeholder="Mobile" required class="w-full bg-transparent outline-none"></div>
             </div>
             <div>
                <div class="field-label">Age</div>
                <div class="input-wrapper px-5 py-3.5"><input type="number" placeholder="Age" required class="w-full bg-transparent outline-none"></div>
             </div>
          </div>
        `;
        container.appendChild(div);
      };

      const form = document.getElementById('registrationForm');
      form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Submitting...`;

        const members = Array.from(container.children).map(card => {
          const inps = card.querySelectorAll('input');
          return { name: inps[0].value, phone: inps[1].value, age: inps[2].value };
        });

        const payload = {
          visitDate: document.getElementById('visitDate').value,
          fullName: document.getElementById('fullName').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value,
          age: document.getElementById('age').value,
          members: members
        };

        try {
          await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', cache: 'no-cache', body: JSON.stringify(payload) });
          alert('Registration Successful!');
          window.location.reload();
        } catch (err) {
          alert('Submission Error. Please try again.');
          btn.disabled = false;
          btn.innerHTML = `<span>SUBMIT</span> <i class="fa-solid fa-paper-plane text-base opacity-80"></i>`;
        }
      };
    });
  </script>
</body>
</html>
