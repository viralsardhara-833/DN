<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gurutattva - Registration</title>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-brown: #6b5a3e;
      --brand-blue: #8ecae6;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: url('background.jpg') center center no-repeat fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .serif-title { font-family: 'Cinzel', serif; }

    /* Unified Box - Improved Glassmorphism */
    .main-unified-box {
      background: rgba(255, 255, 255, 0.4); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    /* Inner Cards */
    .inner-card {
      background: rgba(255, 255, 255, 0.85); 
      border-radius: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .input-wrapper {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      transition: all 0.2s ease;
    }
    .input-wrapper:focus-within {
      border-color: var(--brand-brown);
      ring: 3px rgba(107, 90, 62, 0.1);
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 6px;
      display: block;
    }

    .btn-submit {
      background: var(--brand-brown);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      transition: transform 0.2s active;
    }
    .btn-submit:active {
      transform: scale(0.96);
    }

    /* Prevent text zooming on iPhone */
    input, select, textarea {
      font-size: 16px !important;
    }

    /* Custom scrollbar for better feel */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--brand-brown); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-3 sm:py-12 sm:px-6">

  <!-- THE MAIN CONTAINER -->
  <div class="main-unified-box w-full max-w-2xl rounded-[2.5rem] sm:rounded-[4rem] overflow-hidden flex flex-col">
    
    <!-- Header Section -->
    <header class="p-6 sm:p-12 flex flex-col items-center justify-center text-center border-b border-white/20">
      <img src="logo.png" alt="Logo" class="h-20 sm:h-28 w-auto mb-4 drop-shadow-lg">
      <h1 class="serif-title text-xl sm:text-3xl font-bold brand-brown mb-1">Dhyansthali Navsari</h1>
      <p class="text-[10px] sm:text-sm font-bold text-stone-700 tracking-tight whitespace-nowrap">
        A Meditation Sanctuary | Arabian Sea 🌊
      </p>
    </header>

    <!-- Form Section -->
    <main class="p-4 sm:p-10 flex-1 space-y-6 sm:space-y-10">
      <form id="registrationForm" class="space-y-6 sm:space-y-10">
        
        <!-- Visit Date -->
        <div class="inner-card p-5 sm:p-8">
          <label class="field-label">Planned Visit Date</label>
          <div class="input-wrapper px-4 py-3 sm:py-4">
            <input type="date" id="visitDate" required class="w-full bg-transparent outline-none text-stone-900 font-bold">
          </div>
        </div>

        <!-- Primary Visitor -->
        <div class="inner-card p-5 sm:p-8 border-l-[6px] sm:border-l-[10px] border-[#6b5a3e]">
          <div class="flex items-center gap-3 mb-6 sm:mb-8">
            <div class="h-8 w-8 sm:h-10 sm:w-10 rounded-full bg-[#6b5a3e] text-white flex items-center justify-center font-bold text-sm sm:text-lg">1</div>
            <h3 class="serif-title text-lg sm:text-2xl font-bold text-stone-900">Primary Visitor</h3>
          </div>

          <div class="space-y-5 sm:space-y-6">
            <div>
              <label class="field-label">Mobile Number</label>
              <div class="flex gap-2">
                <div class="flex items-center gap-2 px-3 py-3 sm:px-4 sm:py-4 input-wrapper bg-stone-50">
                  <img src="https://flagcdn.com/w40/in.png" class="w-5 shadow-sm">
                  <span class="font-bold text-stone-700 text-sm">+91</span>
                </div>
                <div class="input-wrapper flex-1 px-4 py-3 sm:py-4">
                  <input type="tel" id="phone" placeholder="Phone Number" required class="w-full bg-transparent outline-none">
                </div>
              </div>
            </div>

            <div>
              <label class="field-label">Full Name</label>
              <div class="input-wrapper px-4 py-3 sm:py-4">
                <input type="text" id="fullName" placeholder="Full name as per ID" required class="w-full bg-transparent outline-none">
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
              <div>
                <label class="field-label">Email</label>
                <div class="input-wrapper px-4 py-3 sm:py-4">
                  <input type="email" id="email" placeholder="email@gmail.com" required class="w-full bg-transparent outline-none">
                </div>
              </div>
              <div>
                <label class="field-label">Age</label>
                <div class="input-wrapper px-4 py-3 sm:py-4">
                  <input type="number" id="age" placeholder="Age" required class="w-full bg-transparent outline-none">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Additional Members -->
        <div id="membersContainer" class="space-y-6"></div>

        <!-- Add Button -->
        <button type="button" id="addMemberBtn" class="w-full py-4 rounded-2xl border-2 border-dashed border-white/60 text-stone-800 font-bold text-[10px] sm:text-xs uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-white/40 transition-all">
          <i class="fa-solid fa-plus-circle text-lg"></i> Add Family Member
        </button>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit w-full py-4 sm:py-6 text-white font-black text-base sm:text-xl rounded-2xl sm:rounded-[2.5rem] flex items-center justify-center gap-3 shadow-xl">
          <span>SUBMIT</span>
          <i class="fa-solid fa-paper-plane text-sm sm:text-lg opacity-80"></i>
        </button>
      </form>
    </main>

    <!-- Footer Section -->
    <footer class="bg-black/80 p-6 sm:p-12 text-white border-t border-white/10 rounded-b-[2.5rem] sm:rounded-b-[4rem]">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
        <div class="space-y-2">
          <h4 class="serif-title text-[10px] sm:text-xs font-black text-[#8ecae6] tracking-[0.2em] uppercase">Location</h4>
          <p class="text-xs sm:text-sm leading-relaxed text-stone-200">
            Samarpan Ashram Marg, Dandi-Onjal Road,<br>
            Dandi, Gujarat 396412.
          </p>
        </div>
        <div class="space-y-2">
          <h4 class="serif-title text-[10px] sm:text-xs font-black text-[#8ecae6] tracking-[0.2em] uppercase">Connect</h4>
          <div class="text-xs sm:text-sm space-y-2 font-medium">
            <p class="flex items-center gap-2"><i class="fa-solid fa-phone brand-blue"></i> 9824330246</p>
            <p class="flex items-center gap-2"><i class="fa-solid fa-envelope brand-blue"></i> dhyansthalinavsari@gmail.com</p>
          </div>
        </div>
      </div>
      <div class="mt-8 pt-6 border-t border-white/10 text-center">
        <p class="text-[8px] sm:text-[10px] text-stone-500 font-bold uppercase tracking-[0.3em]">Gurutattva • Spiritual Sanctuary</p>
      </div>
    </footer>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx11gkiVOS8G0imymHIQ3b-0VavqPRLQfwcurAyBnF2yAfDgUlnLHZKM7xyMUQh3Mpe/exec";

    document.addEventListener('DOMContentLoaded', () => {
      const addBtn = document.getElementById('addMemberBtn');
      const container = document.getElementById('membersContainer');
      let memberCount = 1;

      // Handle Visit Date (Min: Tomorrow)
      const dateInp = document.getElementById('visitDate');
      const tmrw = new Date();
      tmrw.setDate(tmrw.getDate() + 1);
      dateInp.min = tmrw.toISOString().split('T')[0];

      addBtn.onclick = () => {
        memberCount++;
        const div = document.createElement('div');
        div.className = "inner-card p-5 sm:p-8 relative animate-in fade-in slide-in-from-top-4 duration-300";
        div.innerHTML = `
          <button type="button" onclick="this.parentElement.remove()" class="absolute top-4 right-4 text-stone-400">
            <i class="fa-solid fa-circle-xmark text-xl"></i>
          </button>
          <div class="flex items-center gap-3 mb-6">
            <div class="h-8 w-8 rounded-full bg-stone-100 text-stone-500 flex items-center justify-center font-bold text-xs">${memberCount}</div>
            <h3 class="serif-title font-bold text-stone-900">Visitor ${memberCount}</h3>
          </div>
          <div class="space-y-4">
            <div>
                <label class="field-label">Full Name</label>
                <div class="input-wrapper px-4 py-3"><input type="text" placeholder="Name" required class="w-full bg-transparent outline-none"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="field-label">Mobile</label>
                <div class="input-wrapper px-4 py-3"><input type="tel" placeholder="Mobile" required class="w-full bg-transparent outline-none"></div>
              </div>
              <div>
                <label class="field-label">Age</label>
                <div class="input-wrapper px-4 py-3"><input type="number" placeholder="Age" required class="w-full bg-transparent outline-none"></div>
              </div>
            </div>
          </div>
        `;
        container.appendChild(div);
      };

      const form = document.getElementById('registrationForm');
      form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Processing...`;

        const members = Array.from(container.children).map(card => {
          const inps = card.querySelectorAll('input');
          return { name: inps[0].value, phone: inps[1].value, age: inps[2].value };
        });

        const payload = {
          visitDate: document.getElementById('visitDate').value,
          fullName: document.getElementById('fullName').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value,
          age: document.getElementById('age').value,
          members: members
        };

        try {
          await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', cache: 'no-cache', body: JSON.stringify(payload) });
          alert('Registration Successful!');
          window.location.reload();
        } catch (err) {
          alert('Submission Error. Please try again.');
          btn.disabled = false;
          btn.innerHTML = `<span>SUBMIT</span> <i class="fa-solid fa-paper-plane"></i>`;
        }
      };
    });
  </script>
</body>
</html>
