<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurutattva - Registration</title>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-brown: #6b5a3e;
      --brand-blue: #8ecae6;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: url('background.jpg') center center no-repeat fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .serif-title { font-family: 'Cinzel', serif; }

    /* Unified Box - 30% Transparency */
    .main-unified-box {
      background: rgba(255, 255, 255, 0.3); 
      backdrop-filter: blur(20px); 
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.5);
    }

    /* Form Cards */
    .inner-card {
      background: rgba(255, 255, 255, 0.8); 
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .input-wrapper {
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      transition: all 0.3s ease;
    }
    .input-wrapper:focus-within {
      border-color: var(--brand-brown);
      box-shadow: 0 0 0 4px rgba(107, 90, 62, 0.15);
    }

    .field-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #374151;
      margin-bottom: 6px;
    }

    .btn-submit {
      background: var(--brand-brown);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-submit:hover {
      background: #4a3f2d;
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    /* Responsive adjustments for Laptop vs Mobile */
    @media (min-width: 1024px) {
      .main-unified-box {
        margin-top: 50px;
        margin-bottom: 50px;
      }
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-center p-4 sm:p-8">

  <!-- THE SINGLE UNIFIED BOX -->
  <div class="main-unified-box w-full max-w-4xl rounded-[3rem] sm:rounded-[4rem] overflow-hidden flex flex-col">
    
    <!-- Header Section -->
    <header class="p-8 sm:p-16 flex flex-col items-center justify-center border-b border-white/30 text-center">
      <img src="logo.png" alt="Logo" class="h-24 sm:h-36 w-auto drop-shadow-2xl mb-6 transition-all hover:scale-105">
      <p class="text-xs sm:text-lg font-bold text-stone-900 tracking-widest italic leading-snug">
        A Meditation Sanctuary | Arabian Sea 🌊
      </p>
    </header>

    <!-- Form Section -->
    <main class="p-6 sm:p-14 flex-1">
      <form id="registrationForm" class="space-y-10">
        
        <!-- Visit Date -->
        <div class="inner-card p-6 sm:p-10">
          <div class="field-label">Planned Visit Date</div>
          <div class="input-wrapper px-4 py-4">
            <input type="date" id="visitDate" required class="w-full bg-transparent outline-none text-stone-900 font-bold text-lg">
          </div>
        </div>

        <!-- Primary Visitor -->
        <div class="inner-card p-6 sm:p-10 border-l-[10px] border-[#6b5a3e]">
          <div class="flex items-center gap-4 mb-10">
            <div class="h-10 w-10 rounded-full bg-[#6b5a3e] text-white flex items-center justify-center font-bold text-lg shadow-lg">1</div>
            <h3 class="serif-title text-xl sm:text-2xl font-bold text-stone-900 tracking-tight">Primary Visitor</h3>
          </div>

          <div class="grid grid-cols-1 gap-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div>
                <div class="field-label">Mobile Number</div>
                <div class="flex gap-3">
                  <div class="flex items-center gap-2 px-4 py-4 input-wrapper bg-stone-100/50">
                    <img src="https://flagcdn.com/w40/in.png" class="w-6 shadow-sm">
                    <span class="font-bold text-stone-700">+91</span>
                  </div>
                  <div class="input-wrapper flex-1 px-5 py-4">
                    <input type="tel" id="phone" placeholder="Phone Number" required class="w-full bg-transparent outline-none text-stone-900 font-medium">
                  </div>
                </div>
              </div>
              <div>
                <div class="field-label">Full Name</div>
                <div class="input-wrapper px-5 py-4">
                  <input type="text" id="fullName" placeholder="Your Full Name" required class="w-full bg-transparent outline-none text-stone-900 font-medium">
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div>
                <div class="field-label">Email Address</div>
                <div class="input-wrapper px-5 py-4">
                  <input type="email" id="email" placeholder="email@gmail.com" required class="w-full bg-transparent outline-none text-stone-900 font-medium">
                </div>
              </div>
              <div>
                <div class="field-label">Age</div>
                <div class="input-wrapper px-5 py-4">
                  <input type="number" id="age" placeholder="Your Age" required class="w-full bg-transparent outline-none text-stone-900 font-medium">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Members -->
        <div id="membersContainer" class="space-y-10"></div>

        <!-- Add Button -->
        <button type="button" id="addMemberBtn" class="w-full py-5 rounded-[2rem] border-2 border-dashed border-white/80 text-stone-900 font-black text-xs uppercase tracking-[0.3em] flex items-center justify-center gap-3 hover:bg-white/40 transition-all">
          <i class="fa-solid fa-plus-circle text-xl"></i> Add Family Member
        </button>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit w-full py-6 text-white font-black text-xl rounded-[2.5rem] flex items-center justify-center gap-4 mt-14 shadow-2xl tracking-[0.4em]">
          <span>SUBMIT</span>
          <i class="fa-solid fa-paper-plane text-lg opacity-80"></i>
        </button>
      </form>
    </main>

    <!-- Footer Section (High Contrast Visibility) -->
    <footer class="bg-black/70 p-10 sm:p-16 text-white border-t border-white/20">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
        <div class="space-y-4">
          <h4 class="serif-title text-sm font-black text-[#8ecae6] tracking-[0.3em] uppercase">Location</h4>
          <p class="text-base leading-relaxed text-stone-100 font-medium max-w-sm">
            Samarpan Ashram Marg, Dandi-Onjal Road,<br>
            Dandi, Gujarat 396412.
          </p>
        </div>
        <div class="space-y-6">
          <h4 class="serif-title text-sm font-black text-[#8ecae6] tracking-[0.3em] uppercase">Connect</h4>
          <div class="space-y-4">
            <a href="tel:9824330246" class="flex items-center gap-4 text-lg font-bold hover:text-[#8ecae6] transition-colors">
              <i class="fa-solid fa-phone-volume text-[#8ecae6]"></i> 9824330246
            </a>
            <a href="mailto:dhyansthalinavsari@gmail.com" class="flex items-center gap-4 text-lg font-bold hover:text-[#8ecae6] transition-colors">
              <i class="fa-solid fa-envelope-open-text text-[#8ecae6]"></i> dhyansthalinavsari@gmail.com
            </a>
          </div>
        </div>
      </div>
      <div class="mt-12 pt-8 border-t border-white/10 text-center">
        <p class="text-[10px] text-stone-400 font-bold uppercase tracking-[0.5em]">Gurutattva • Spiritual Sanctuary</p>
      </div>
    </footer>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx11gkiVOS8G0imymHIQ3b-0VavqPRLQfwcurAyBnF2yAfDgUlnLHZKM7xyMUQh3Mpe/exec";

    document.addEventListener('DOMContentLoaded', () => {
      const addBtn = document.getElementById('addMemberBtn');
      const container = document.getElementById('membersContainer');
      let memberCount = 1;

      // Set min date
      const dateInp = document.getElementById('visitDate');
      const tmrw = new Date();
      tmrw.setDate(tmrw.getDate() + 1);
      dateInp.min = tmrw.toISOString().split('T')[0];

      addBtn.onclick = () => {
        memberCount++;
        const div = document.createElement('div');
        div.className = "inner-card p-6 sm:p-10 relative animate-in fade-in slide-in-from-top-4 duration-300";
        div.innerHTML = `
          <button type="button" onclick="this.parentElement.remove()" class="absolute top-6 right-6 text-stone-400 hover:text-rose-600 transition-all">
            <i class="fa-solid fa-circle-xmark text-3xl"></i>
          </button>
          <div class="flex items-center gap-4 mb-10">
            <div class="h-10 w-10 rounded-full bg-stone-200 text-stone-700 flex items-center justify-center font-bold text-lg shadow-inner">${memberCount}</div>
            <h3 class="serif-title font-bold text-stone-900 text-xl">Visitor ${memberCount}</h3>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
             <div class="lg:col-span-1">
                <div class="field-label">Full Name</div>
                <div class="input-wrapper px-5 py-4"><input type="text" placeholder="Name" required class="w-full bg-transparent outline-none"></div>
             </div>
             <div>
                <div class="field-label">Mobile</div>
                <div class="input-wrapper px-5 py-4"><input type="tel" placeholder="Mobile" required class="w-full bg-transparent outline-none"></div>
             </div>
             <div>
                <div class="field-label">Age</div>
                <div class="input-wrapper px-5 py-4"><input type="number" placeholder="Age" required class="w-full bg-transparent outline-none"></div>
             </div>
          </div>
        `;
        container.appendChild(div);
      };

      const form = document.getElementById('registrationForm');
      form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Processing...`;

        const members = Array.from(container.children).map(card => {
          const inps = card.querySelectorAll('input');
          return { name: inps[0].value, phone: inps[1].value, age: inps[2].value };
        });

        const payload = {
          visitDate: document.getElementById('visitDate').value,
          fullName: document.getElementById('fullName').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value,
          age: document.getElementById('age').value,
          members: members
        };

        try {
          await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', cache: 'no-cache', body: JSON.stringify(payload) });
          alert('Registration Successful!');
          window.location.reload();
        } catch (err) {
          alert('Submission Error. Check your connection.');
          btn.disabled = false;
          btn.innerHTML = `<span>SUBMIT</span> <i class="fa-solid fa-paper-plane text-lg"></i>`;
        }
      };
    });
  </script>
</body>
</html>
